<!DOCTYPE html>
<html>
<head>
  <base target="_top">
</head>
<body>

<h2>Purchase Entry</h2>

<label>Date:</label>
<input type="date" id="purchaseDate">
<br><br>

<label>Material Code:</label>
<input type="text" id="materialCode">
<br><br>

<label>Quantity:</label>
<input type="number" id="quantity">
<br><br>

<label>Unit Cost:</label>
<input type="number" id="unitCost">
<br><br>

<button onclick="savePurchase()">Save Purchase</button>

<div id="message"></div>

<script>

function savePurchase(){

  const purchase = {
    purchaseDate: document.getElementById("purchaseDate").value,
    materialCode: document.getElementById("materialCode").value,
    quantity: document.getElementById("quantity").value,
    unitCost: document.getElementById("unitCost").value
  };

  google.script.run
    .withSuccessHandler(function(msg){
      document.getElementById("message").innerHTML = msg;
    })
    .savePurchase(purchase);

}

</script>

</body>
</html>
