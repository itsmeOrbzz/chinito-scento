<script>

function loadInventoryAsOf(){

  const reportDate =

    document.getElementById(
      "inventoryDate"
    ).value;

  if(!reportDate){

    alert(
      "Please select a report date."
    );

    return;

  }

  google.script.run

    .withSuccessHandler(
      showInventoryAsOf
    )

    .getInventoryAsOf(
      reportDate
    );

}

function showInventoryAsOf(data){

  let html =

    "<h2>Inventory As Of Report</h2>";

  for(let category in data){

    html += "<hr>";

    html +=

      "<h3>" +
      category +
      "</h3>";

    html +=
      "<table>";

    html +=

      "<tr>" +

      "<th>Material</th>" +

      "<th>Stock</th>" +

      "<th>Unit</th>" +

      "</tr>";

    data[category].forEach(function(item){

      html +=

        "<tr>" +

        "<td>" +
        item.code +
        "</td>" +

        "<td>" +
        item.stock +
        "</td>" +

        "<td>" +
        item.unit +
        "</td>" +

        "</tr>";

    });

    html += "</table>";

  }

  document.getElementById(
    "result"
  ).innerHTML = html;

}
