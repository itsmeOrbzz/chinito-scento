<script>

function loadInvoiceList(){

  google.script.run

    .withSuccessHandler(function(data){

      let ddl =

        document.getElementById(
          "invoiceList"
        );

      ddl.innerHTML =

        '<option value="">Select Invoice</option>';

      if(
        !data ||
        data.length === 0
      ){
        return;
      }

      data.forEach(function(item){

        ddl.innerHTML +=

          '<option value="' +

          item.invoiceNo +

          '">' +

          item.invoiceNo +

          ' | ' +

          item.customerName +

          ' | ₱' +

          formatAmount(
            item.totalAmount
          ) +

          '</option>';

      });

    })

    .withFailureHandler(function(error){

      document.getElementById(
        "invoiceMessage"
      ).innerHTML =

        error.message;

    })

    .getInvoiceList();

}



function viewInvoice(
  invoiceNo
){

  google.script.run

    .withSuccessHandler(function(data){

      const header =
        data.header;

      let html = "";

      html += `

      <div style="
        text-align:center;
        margin-bottom:20px;
      ">

        <h1 style="
          margin:0;
          color:#2c3e50;
        ">
          CHINITO SCENTO
        </h1>

        <h2 style="
          margin:5px 0;
        ">
          SALES INVOICE
        </h2>

      </div>

      `;

      html += "<hr>";

      html +=
        "<p><b>Invoice No :</b> " +
        header[0] +
        "</p>";

      html +=
        "<p><b>Invoice Date :</b> " +
        header[1] +
        "</p>";

      html +=
        "<p><b>Invoice Time :</b> " +
        header[2] +
        "</p>";

      html +=
        "<p><b>Sales Order No :</b> " +
        header[3] +
        "</p>";

      html +=
        "<p><b>Customer Code :</b> " +
        header[4] +
        "</p>";

      html +=
        "<p><b>Customer Name :</b> " +
        header[5] +
        "</p>";

      html +=
        "<p><b>Payment Form :</b> " +
        header[7] +
        "</p>";

      if(
        header[7] ==
        "CREDIT"
      ){

        html +=
          "<p><b>Terms :</b> " +
          header[8] +
          " Days</p>";

        html +=
          "<p><b>Due Date :</b> " +
          header[9] +
          "</p>";

      }

      html +=
        "<p><b>Invoice Status :</b> " +
        header[11] +
        "</p>";

      html += "<br>";

      html +=
        "<table border='1' cellpadding='5' style='width:100%;border-collapse:collapse;'>";

      html +=
        "<tr>" +
        "<th>Product Code</th>" +
        "<th>Product Name</th>" +
        "<th>Qty</th>" +
        "<th>Unit Price</th>" +
        "<th>Amount</th>" +
        "</tr>";

      let total = 0;

      data.lines.forEach(function(line){

        total +=
          Number(
            line.lineAmount || 0
          );

        html +=

          "<tr>" +

          "<td>" +
          line.productCode +
          "</td>" +

          "<td>" +
          line.productName +
          "</td>" +

          "<td>" +
          line.quantity +
          "</td>" +

          "<td style='text-align:right;'>" +
          formatAmount(
            line.unitPrice
          ) +
          "</td>" +

          "<td style='text-align:right;'>" +
          formatAmount(
            line.lineAmount
          ) +
          "</td>" +

          "</tr>";

      });

      html +=

        "<tr>" +

        "<td colspan='4'>" +

        "<b>TOTAL AMOUNT</b>" +

        "</td>" +

        "<td style='text-align:right;'><b>₱" +

        formatAmount(
          total
        ) +

        "</b></td>" +

        "</tr>";

      html +=
        "</table>";

      html += "<br>";

      html +=
        "<p><b>Prepared By :</b> " +
        header[10] +
        "</p>";

      html += `

      <br><br>

      <div style="
        text-align:center;
      ">

        <button onclick="window.print()">
          Print
        </button>

        <button onclick="
          document.getElementById(
            'invoicePreview'
          ).innerHTML='';
        ">
          Close
        </button>

      </div>

      `;

      document.getElementById(
        "invoicePreview"
      ).innerHTML =
        html;

    })

    .withFailureHandler(function(error){

      alert(
        error.message
      );

    })

    .getInvoice(
      invoiceNo
    );

}



function loadSelectedInvoice(){

  const invoiceNo =

    document.getElementById(
      "invoiceList"
    ).value;

  if(
    !invoiceNo
  ){
    return;
  }

  viewInvoice(
    invoiceNo
  );

}

</script>
